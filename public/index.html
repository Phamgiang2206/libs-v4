</style><div class="pattern"></div><header><img class="brand-logo" src="/images/brand-logo.png" alt="Logo LIB’S"><div class="brand-name">LIB’S BURGERTORI<small>YOUR LIPS, MY LIPS, BURGER LIB’S.</small></div></header><main id="app"></main><button id="basket" hidden onclick="show('cart')"></button><div id="toast" role="status"></div><footer><nav><button data-page="home" onclick="show('home')"><span class="navicon">⌂</span>Trang chủ</button><button data-page="menu" onclick="show('menu')"><span class="navicon">☷</span>Menu</button><button data-page="cart" onclick="show('cart')"><span class="navicon">▣</span>Giỏ (<span id="count">0</span>)</button><button data-page="rewards" onclick="show('rewards')"><span class="navicon">☆</span>Rewards</button><button data-page="account" onclick="show('account')"><span class="navicon">◎</span>Tài khoản</button></nav></footer><dialog id="modal"></dialog><script type="module">
let menu=[],addons=[],cart=[],token=localStorage.getItem('libsToken3')||'',user=null,orders=[],page='home',cat='all';const $=id=>document.getElementById(id),money=n=>n.toLocaleString('vi-VN')+'đ',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(p,b,method='POST',key=''){let r=await fetch('/api/'+p,{method:b===undefined?'GET':method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,'x-admin-key':key},...(b===undefined?{}:{body:JSON.stringify(b)})});let j=await r.json();if(!r.ok)throw Error(j.error||'Lỗi');return j}async function refresh(){if(token)try{({user,orders}=await api('me'))}catch{user=null;token='';localStorage.removeItem('libsToken3')}}function save(){try{localStorage.setItem('libsCart3',JSON.stringify(cart))}catch{};const n=cart.reduce((s,x)=>s+x.quantity,0);$('count').textContent=n;const bar=$('basket');bar.hidden=!n||page==='cart';bar.textContent=`Xem giỏ hàng (${n}) · ${money(cart.reduce((s,x)=>s+x.price*x.quantity,0))}`;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}const nutrition=x=>`${x.kcal??'Chưa xác minh'} kcal · ${x.protein??'Chưa xác minh'} g protein`;function cards(items){return '<div class="grid">'+items.map(x=>`<article class="card product"><img src="${x.image}" alt="${esc(x.name)}"><section><h3>${esc(x.name)}</h3><small>${nutrition(x)}</small><p>${esc(x.description)}</p><div class="price">${money(x.price)}</div><button onclick="detail('${x.id}')">Chọn món +</button></section></article>`).join('')+'</div>'}window.show=async p=>{page=p;save();let a=$('app');if(p==='home')a.innerHTML=`<div class="hero"><img class="hero-mascot" src="/images/mascot-varsity.png" alt=""><small style="color:white">WELCOME TO LIB’S CLUB</small><h1>Your lips, my lips, burger Lib’s.</h1><p>${user?esc(user.name)+' · '+user.points+' điểm':'Tham gia hội viên LIB’S'}</p><button style="background:#ffdf55;color:#084ca5" onclick="show('menu')">Đặt món ngay</button></div><div class="brand-strip"><img src="/images/mascot-curly.png" alt=""><div><strong>Hey, Libsie!</strong><p>Khám phá ưu đãi và tích điểm cùng LIB’S.</p><button onclick="show('rewards')">Xem ưu đãi</button></div></div><div class="service"><button onclick="show('menu')">Mang đi · Pickup →</button><button onclick="show('menu')">Giao tận nơi · Delivery →</button></div><h2>Fan favourites</h2>${cards(menu.filter(x=>x.category==='burger'))}`;if(p==='menu')a.innerHTML=`<h1>Our menu.</h1><div class="tabs">${[['all','Tất cả'],['burger','Bơ gơ'],['combo','Cômbo'],['side','Món phụ'],['drink','Nước']].map(([k,n])=>`<button class="${cat===k?'active':''}" onclick="filter('${k}')">${n}</button>`).join('')}</div>${cards(menu.filter(x=>cat==='all'||x.category===cat))}`;if(p==='cart')a.innerHTML=`<h1>Giỏ hàng</h1>${cart.length?'':'<div class="card">Giỏ hàng đang trống. <button onclick="show(\'menu\')">Khám phá menu</button></div>'}${cart.map((x,i)=>`<div class="card"><b>${esc(menu.find(m=>m.id===x.id)?.name)} × ${x.quantity}</b><p>${x.extras.map(id=>esc(addons.find(a=>a.id===id)?.name)).join(', ')}</p><p>${x.drinks.map(id=>esc(menu.find(m=>m.id===id)?.name)).join(', ')}</p><div class="row"><button onclick="changeQty(${i},-1)">−</button><b>${x.quantity}</b><button onclick="changeQty(${i},1)">+</button><strong>${money(x.price*x.quantity)}</strong><button onclick="removeItem(${i})">Xóa</button></div></div>`).join('')}<p>Tiền món dự kiến: <b>${money(cart.reduce((s,x)=>s+x.price*x.quantity,0))}</b></p>${cart.length?`<form id="checkout"><label>Tên<input name="name" required value="${esc(user?.name)}"></label><label>SĐT<input name="phone" required value="${esc(user?.phone)}"></label><label>Nhận món<select name="fulfillment"><option value="pickup">Pickup</option><option value="delivery">Delivery (+15.000đ thử nghiệm)</option></select></label><label>Địa chỉ giao<input name="address"></label><label>Thanh toán<select name="payment"><option value="cod">COD</option><option value="qr">QR (chưa kết nối)</option></select></label><label>Voucher<input name="voucher"></label><label><input type="checkbox" name="reward"> Đổi 500 điểm giảm 15.000đ</label><button>Gửi đơn thử nghiệm</button></form>`:''}`;if(p==='account'){await refresh();a.innerHTML=user?`<h1>${esc(user.name)}</h1><p>Mã hội viên: ${esc(user.id)}</p><p>${user.points} điểm</p><button onclick="logout()">Đăng xuất</button><h2>Lịch sử đơn</h2>${orders.map(o=>`<div class="card">${esc(o.id)} · ${esc(o.status)} · ${money(o.total)}</div>`).join('')}`:`<h1>LIB’S Club</h1><form id="auth"><label>Tên (đăng ký)<input name="name"></label><label>SĐT<input name="phone" required></label><label>Mật khẩu (ít nhất 8 ký tự)<input name="password" type="password" required minlength="8"></label><button name="mode" value="login">Đăng nhập</button> <button name="mode" value="register">Đăng ký</button></form><p class="notice">Chỉ dùng thông tin thử nghiệm.</p>`}if(p==='rewards'){await refresh();let v=await api('vouchers');a.innerHTML=`<h1>LIB’S Rewards</h1><div class="hero"><img class="hero-mascot" src="/images/mascot-hoodie.png" alt=""><h1>${user?.points||0} pts</h1><p>1.000đ = 1 điểm khi đơn hoàn tất</p></div><div class="card">500 điểm = giảm 15.000đ tại giỏ hàng.</div>${v.vouchers.map(x=>`<div class="card"><h2>${esc(x.code)} · ${x.percent}% OFF</h2><p>Còn ${x.limit-x.used} lượt · tối thiểu ${money(x.min)}</p></div>`).join('')}<button onclick="show('account')">Tài khoản hội viên</button>`}if(p==='admin')a.innerHTML=`<h1>Admin</h1><input id="key" type="password" placeholder="ADMIN_KEY"><button onclick="adminLoad()">Tải dữ liệu</button><div id="adminData"></div><form id="voucherForm"><h2>Tạo voucher</h2><input name="code" placeholder="Mã" required><input name="percent" type="number" placeholder="% giảm" required><input name="limit" type="number" placeholder="Số lượt" required><input name="min" type="number" value="0"><button>Tạo</button></form>`;};function toast(msg){$('toast').textContent=msg;$('toast').classList.add('visible');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').classList.remove('visible'),2200)};window.changeQty=(i,d)=>{cart[i].quantity=Math.max(1,Math.min(30,cart[i].quantity+d));show('cart')};window.filter=c=>{cat=c;show('menu')};window.removeItem=i=>{cart.splice(i,1);show('cart')};window.detail=id=>{let x=menu.find(m=>m.id===id),n=x.category==='combo'?(id.startsWith('share')?2:1):0;$('modal').innerHTML=`<img src="${x.image}"><h2>${esc(x.name)}</h2><p>${esc(x.description)}</p><form id="custom"><input type="hidden" name="id" value="${id}">${['burger','combo'].includes(x.category)?'<h3>Thêm gì?</h3>'+addons.map(a=>`<label><input type="checkbox" name="extra" value="${a.id}"> ${esc(a.name)} +${money(a.price)} · ${nutrition(a)}</label>`).join(''):''}${Array.from({length:n},(_,i)=>`<label>Nước ${i+1}<select name="drink">${menu.filter(m=>m.category==='drink').map(m=>`<option value="${m.id}">${esc(m.name)}${m.price>12000?' +'+money(m.price-12000):''}</option>`).join('')}</select></label>`).join('')}${['combo-chicken','combo-beef'].includes(id)?'<label><input type="checkbox" name="upgrade"> Khoai L +5.000đ</label>':''}<label>Số lượng<input name="quantity" type="number" min="1" max="30" value="1" required></label><p id="calc"></p><button type="submit" class="add">Thêm vào giỏ</button> <button type="button" onclick="document.getElementById('modal').close()">Đóng</button></form>`;$('modal').showModal();calc()};function getLine(){let f=new FormData($('custom')),x=menu.find(m=>m.id===f.get('id')),price=x.price,kcal=x.kcal,protein=x.protein,extras=f.getAll('extra'),drinks=f.getAll('drink'),upgrade=f.has('upgrade');for(let id of extras){let a=addons.find(m=>m.id===id);price+=a.price;if(kcal!==null)kcal+=a.kcal;if(protein!==null)protein+=a.protein}for(let id of drinks){let d=menu.find(m=>m.id===id);price+=Math.max(0,d.price-12000);if(kcal!==null)kcal=d.kcal===null?null:kcal+d.kcal-139}if(upgrade){price+=5000;if(kcal!==null)kcal+=133;if(protein!==null)protein+=2.3}return {id:x.id,quantity:Number(f.get('quantity')),extras,drinks,upgrade,price,kcal,protein}}function calc(){let x=getLine();$('calc').textContent=money(x.price*x.quantity)+' · mỗi phần: '+nutrition(x)}document.addEventListener('input',e=>{if(e.target.closest('#custom'))calc()});document.addEventListener('submit',async e=>{e.preventDefault();let f=new FormData(e.target),b=Object.fromEntries(f);try{if(e.target.id==='custom'){const item=getLine();cart.push(item);save();$('modal').close();toast('Đã thêm món vào giỏ');}if(e.target.id==='auth'){let j=await api(e.submitter.value,b);token=j.token;localStorage.setItem('libsToken3',token);await show('account')}if(e.target.id==='checkout'){let j=await api('orders',{...b,items:cart,reward:f.has('reward')});cart=[];save();alert('Đơn '+j.order.id+' · '+money(j.order.total));show('account')}if(e.target.id==='voucherForm'){await api('admin/vouchers',{code:b.code.toUpperCase(),percent:+b.percent,limit:+b.limit,min:+b.min},'POST',$('key').value);alert('Đã tạo')}}catch(err){alert(err.message)}});window.logout=async()=>{await api('logout',{});token='';user=null;localStorage.removeItem('libsToken3');show('account')};window.adminLoad=async()=>{try{let k=$('key').value,j=await api('admin/orders',undefined,'GET',k),u=await api('admin/users',undefined,'GET',k);$('adminData').innerHTML=`<p>${u.users.length} hội viên</p>`+j.orders.map(o=>`<div class="card">${esc(o.id)} · ${esc(o.name)} · ${money(o.total)}<p>${esc(o.status)}</p><select onchange="statusChange('${o.id}',this.value)"><option>Chọn trạng thái</option>${['Đã xác nhận','Đang chuẩn bị','Đang giao / Chờ lấy','Hoàn tất','Đã hủy'].map(s=>`<option>${s}</option>`).join('')}</select></div>`).join('')}catch(e){alert(e.message)}};window.statusChange=async(id,status)=>{try{await api('admin/orders/'+id,{status},'PATCH',$('key').value);adminLoad()}catch(e){alert(e.message)}};try{({menu,addons}=await api('menu'));try{const old=JSON.parse(localStorage.getItem('libsCart3')||'[]');if(Array.isArray(old))cart=old.filter(x=>menu.some(m=>m.id===x.id)&&Number.isInteger(x.quantity)&&x.quantity>0&&Number.isFinite(x.price)&&Array.isArray(x.extras)&&Array.isArray(x.drinks))}catch{};await refresh();show(location.hash==='#admin'?'admin':'home')}catch(e){$('app').textContent=e.message}
</script></html>
